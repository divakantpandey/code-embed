[project]
name = "code-embed"
version = "0.1.0"
description = "Train small embedding models for code that run on a laptop"
readme = "README.md"
authors = [
    { name = "Divakant Pandey", email = "divakant01@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    # Core ML
    "torch>=2.1",
    "transformers>=4.36",
    "sentence-transformers>=2.3",
    "datasets>=2.16",
    "accelerate>=0.25",
    "tokenizers>=0.15",
    # Evaluation
    "ranx>=0.3",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    # Observability
    "wandb>=0.16",
    "tensorboard>=2.15",
    "mlflow>=2.9",
    # Data versioning
    "dvc>=3.30",
    # Export
    "onnx>=1.15",
    "onnxruntime>=1.16",
    "optimum>=1.15",
    # Visualization
    "umap-learn>=0.5",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    # Misc
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.9",
    "datasketch>=1.6",
    "onnxscript>=0.7.2",
    "optuna>=5.0.0",
    "scalene>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
    "pre-commit>=3.6",
    "ipykernel>=6.27",
    "jupyter>=1.0",
]

[project.scripts]
code-embed-train = "scripts.train:main"
code-embed-tune = "scripts.tune:main"
code-embed-eval = "scripts.evaluate:main"
code-embed-export = "scripts.export:main"
code-embed-demo = "scripts.demo:main"
code-embed-profile = "scripts.profile_runner:main"
pycode-embed-train = "scripts.train:main"
pycode-embed-tune = "scripts.tune:main"
pycode-embed-eval = "scripts.evaluate:main"
pycode-embed-export = "scripts.export:main"
pycode-embed-demo = "scripts.demo:main"
pycode-embed-profile = "scripts.profile_runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "scripts"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = ["E501", "B905", "TCH", "B008", "N812"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring GPU",
    "quality_gate: marks quality gate tests that block promotion",
]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
