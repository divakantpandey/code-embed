# Language Preset: Java
language: "java"
dataset:
  name: "code-search-net/code_search_net"
  subset: "java"
  code_column: "func_code_string"
  docstring_column: "func_documentation_string"
  file_extensions: [".java"]
  min_tokens: 16
  max_tokens: 512
  comment_ratio_threshold: 0.35
  dedup_threshold: 0.85
benchmarks:
  - name: "CodeSearchNet-Java"
    dataset: "code_search_net"
    language: "java"
