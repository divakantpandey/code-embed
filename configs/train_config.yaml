# CodeEmbed Training Configuration
# Model, data, curriculum stages, and logging configuration

model:
  base: "microsoft/unixcoder-base"
  max_seq_length: 8192
  embedding_dim: 1536
  pooling: "cls"  # "cls" or "mean"

data:
  datasets:
    - name: "code_search_net"
      subset: "python"
      split: "train"
    - name: "cosqa"
      split: "train"
  preprocessing:
    min_tokens: 10
    max_tokens: 8192
    dedup_jaccard_threshold: 0.8
    require_function_def: true
    require_valid_syntax: true
    max_comment_ratio: 0.5
  hard_negatives:
    bm25_top_k: 50
    refresh_every_n_epochs: 2

training:
  seed: 42
  output_dir: "./outputs"
  checkpoint_dir: "./checkpoints"

  stage1:
    enabled: true
    method: "simcse"
    learning_rate: 3.0e-5
    batch_size: 16  # per device
    gradient_accumulation_steps: 8  # effective batch = 128
    epochs: 3
    warmup_ratio: 0.1
    weight_decay: 0.01
    max_grad_norm: 1.0
    fp16: true
    scheduler: "cosine"
    temperature: 0.05

  stage2:
    enabled: true
    method: "mnrl"
    learning_rate: 2.0e-5
    batch_size: 16
    gradient_accumulation_steps: 4  # effective batch = 64
    epochs: 12
    warmup_ratio: 0.1
    weight_decay: 0.01
    max_grad_norm: 1.0
    fp16: true
    scheduler: "cosine_with_restarts"
    scale: 20.0
    early_stopping:
      enabled: true
      patience: 4
      metric: "eval/MRR@10"
      mode: "max"

  stage3:
    enabled: true
    method: "matryoshka"
    learning_rate: 1.0e-5
    batch_size: 16
    gradient_accumulation_steps: 4
    epochs: 5
    scale: 20.0
    dimensions: [64, 128, 256, 384, 768, 1536, 3072]
    dimension_weights: [0.1, 0.1, 0.1, 0.15, 0.15, 0.2, 0.2]
    fp16: true

hardware:
  device: "auto"  # "auto", "mps", "cuda", "cpu"
  num_workers: 4
  pin_memory: true

logging:
  wandb:
    enabled: true
    project: "code-embed"
    log_every_n_steps: 10
  tensorboard:
    enabled: true
    log_dir: "./runs"
  eval_every_n_steps: 500
  save_every_n_steps: 1000
  save_best: true
  save_last: true

alerts:
  loss_spike_multiplier: 3.0
  grad_norm_threshold: 10.0
  nan_halt: true

