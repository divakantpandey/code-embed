# PyCodeEmbed Evaluation Configuration

evaluation:
  device: "auto"
  batch_size: 64

benchmarks:
  codesearchnet:
    enabled: true
    dataset: "code_search_net"
    subset: "python"
    split: "test"
    metrics: ["MRR@1", "MRR@5", "MRR@10", "Recall@1", "Recall@5", "Recall@10", "Recall@100", "NDCG@10", "MAP@10"]

  cosqa:
    enabled: true
    dataset: "cosqa"
    split: "test"
    metrics: ["MRR@10", "Accuracy@1"]

embedding_quality:
  alignment: true
  uniformity: true
  isotropy: true
  intrinsic_dimensionality: true
  nearest_neighbor_overlap:
    enabled: true
    k: 10

visualization:
  umap:
    enabled: true
    n_samples: 5000
    n_neighbors: 15
    min_dist: 0.1
  cosine_histogram:
    enabled: true
    n_pairs: 10000
  qualitative_examples:
    enabled: true
    n_queries: 10
    top_k: 5

report:
  output_dir: "./evaluation_reports"
  format: ["markdown", "json"]

quality_gates:
  csn_python_mrr10: 0.65
  cosqa_accuracy1: 0.50
  uniformity_max: -1.0
  alignment_max: 0.5
  regression_tolerance: 0.02  # max 2% regression allowed
  max_latency_seconds: 0.1
  max_model_size_mb: 250
