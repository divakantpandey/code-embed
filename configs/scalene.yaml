# Scalene Profiler Configuration for PyCodeEmbed
# High-precision CPU, GPU, and Memory profiler

# Profile all dimensions: CPU, Memory, and GPU (not restricted to CPU-only)
memory: true
gpu: true
stacks: false

# Restrict profiling to the repository source modules and scripts
profile-only: "src,scripts"

# Minimum percentage of CPU time to display in the breakdown
cpu-percent-threshold: 1

# Profiling report interval (default: inf outputs at program termination)
profile-interval: inf
