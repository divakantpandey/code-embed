alerts:
  grad_norm_threshold: 10.0
  loss_spike_multiplier: 3.0
  nan_halt: true
data:
  datasets:
  - name: code_search_net
    split: train
    subset: python
  - name: cosqa
    split: train
  hard_negatives:
    bm25_top_k: 50
    refresh_every_n_epochs: 2
  preprocessing:
    dedup_jaccard_threshold: 0.8
    max_comment_ratio: 0.5
    max_tokens: 8192
    min_tokens: 10
    require_function_def: true
    require_valid_syntax: true
hardware:
  device: auto
  num_workers: 4
  pin_memory: true
logging:
  eval_every_n_steps: 500
  save_best: true
  save_every_n_steps: 1000
  save_last: true
  tensorboard:
    enabled: true
    log_dir: ./runs
  wandb:
    enabled: true
    log_every_n_steps: 10
    project: code-embed
model:
  base: microsoft/unixcoder-base
  embedding_dim: 1536
  max_seq_length: 8192
  pooling: mean
training:
  checkpoint_dir: ./checkpoints
  output_dir: ./outputs
  seed: 42
  stage1:
    batch_size: 16
    enabled: true
    epochs: 3
    fp16: true
    gradient_accumulation_steps: 8
    learning_rate: 3.0e-05
    max_grad_norm: 1.0
    method: simcse
    scheduler: cosine
    temperature: 0.05
    warmup_ratio: 0.1
    weight_decay: 0.01
  stage2:
    batch_size: 32
    early_stopping:
      enabled: true
      metric: eval/MRR@10
      mode: max
      patience: 4
    enabled: true
    epochs: 12
    fp16: true
    gradient_accumulation_steps: 4
    learning_rate: 2.6975154833351135e-05
    max_grad_norm: 1.0
    method: mnrl
    scale: 25.0
    scheduler: cosine
    warmup_ratio: 0.2
    weight_decay: 0.00029380279387035364
  stage3:
    batch_size: 16
    dimension_weights:
    - 0.1
    - 0.1
    - 0.1
    - 0.15
    - 0.15
    - 0.2
    - 0.2
    dimensions:
    - 64
    - 128
    - 256
    - 384
    - 768
    - 1536
    - 3072
    enabled: true
    epochs: 5
    fp16: true
    gradient_accumulation_steps: 4
    learning_rate: 1.0e-05
    method: matryoshka
    scale: 20.0
